name: Learning publication integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:synthetic-local-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Offline recovery guards and synthetic target-policy tests
        run: node --test ops/recovery/*.test.mjs scripts/audit-d2c-preflight.test.mjs scripts/d2c-archive-stage.test.mjs
      - run: npm run test:db:learning-integrity
        env:
          WP16_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
      - name: Restricted metadata helper and read-only diagnostic SQL
        run: node scripts/test-show-db-tree-privileges.mjs
      - run: npm run db:generate
      - name: Real-client TLS and isolated WP17B target validation
        run: npx vitest run src/lib/maintenance/database-client-tls.test.ts scripts/wp17b-acceptance-target.test.ts --maxWorkers=2
      - name: Closed database diagnostic and maintenance authentication
        run: npx vitest run src/lib/prisma.test.ts scripts/wp17-acceptance-preflight.test.ts src/lib/maintenance/preview-isolation.test.ts src/lib/maintenance/database-identity.test.ts src/lib/maintenance/database-identity-auth.test.ts src/app/api/maintenance/database-identity/route.test.ts src/lib/finance/financial-maintenance-auth.test.ts src/app/api/maintenance/finance/route.test.ts src/app/api/maintenance/marketplace/route.test.ts src/lib/learning/learning-runtime-gate.test.ts src/app/featuregate-isolation.test.ts --maxWorkers=2
      - name: Combined synthetic commercial chain and notification recovery
        run: npm run test:db:assignment-notifications
      - name: Durable contact admission, encryption and isolated outbox recovery
        run: |
          npm run test:db:contact
          npm run test:db:contact -- --baseline-85
      - name: Contact and payment HTTP, UI and scheduler regressions
        run: npx vitest run src/lib/contact src/app/api/contact src/app/api/payments/mollie/webhook src/components/public/contact-form.test.tsx src/app/contact/page.test.tsx --maxWorkers=2
      - run: node --test ops/marketplace-notifications/dispatch.test.mjs
      - name: Financial concurrency and tenant authorization
        run: npm run test:db:finance && npm run test:db:marketplace-concurrency
      - name: Versioned Compliance and personal learning history
        run: npm run test:db:compliance-runs && npm run test:db:learning
      - name: Session security and synthetic account isolation
        run: npm run test:db:auth-sessions
      - name: Infrastructure and application regressions
        run: npx vitest run src/lib/compliance src/lib/learning src/lib/finance src/lib/credits src/lib/email.test.ts src/components/compliance src/components/arbo-guide --maxWorkers=2
