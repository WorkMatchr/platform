name: Learning publication integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:synthetic-local-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Offline recovery guards and synthetic target-policy tests
        run: node --test ops/recovery/*.test.mjs scripts/audit-d2c-preflight.test.mjs scripts/d2c-archive-stage.test.mjs
      - run: npm run test:db:learning-integrity
        env:
          WP16_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
      - name: Restricted metadata helper and read-only diagnostic SQL
        run: node scripts/test-show-db-tree-privileges.mjs
      - run: npm run db:generate
      - name: Academy authoring, historical certificates and protected version transitions
        env:
          PG_SERVICE: ${{ job.services.postgres.id }}
        run: |
          db="workmatchr_learning_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          docker exec "$PG_SERVICE" createdb -U postgres "$db"
          export DATABASE_URL="${DATABASE_URL%/*}/$db"
          npm run db:deploy
          npm run seed:learning
          npm run seed:learning:exam
          npm run seed:learning:exam:v1.1
          LEARNING_TEST_DATABASE_URL="$DATABASE_URL" npx --no-install vitest run src/lib/learning/learning-final-exam-runtime.integration.test.ts
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE academy_content_editor LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'synthetic-ci-only';
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO academy_content_editor;
          GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO academy_content_editor;
          REVOKE INSERT,UPDATE,DELETE ON _prisma_migrations FROM academy_content_editor;
          GRANT SELECT,USAGE ON ALL SEQUENCES IN SCHEMA public TO academy_content_editor;
          SQL
          export LEARNING_TEST_DATABASE_URL="postgresql://academy_content_editor:synthetic-ci-only@127.0.0.1:5432/$db"
          ACADEMY_RELEASE03_LOCAL_TEST=1 npx --no-install vitest run src/lib/learning/academy-release03.integration.test.ts
      - name: Pro renewals, rollback and concurrent webhook replay
        env:
          PG_SERVICE: ${{ job.services.postgres.id }}
        run: |
          test -n "$PG_SERVICE"
          db_name="workmatchr_b4_$(openssl rand -hex 6)"
          docker exec "$PG_SERVICE" createdb -U postgres "$db_name"
          export DATABASE_URL="${DATABASE_URL%/*}/$db_name"
          npm run db:deploy
          npx --no-install tsx scripts/finance-tests/pro-renewal-regression.ts
      - name: Real-client TLS and isolated WP17B target validation
        run: npx vitest run src/lib/maintenance/database-client-tls.test.ts scripts/wp17b-acceptance-target.test.ts --maxWorkers=2
      - name: Closed database diagnostic and maintenance authentication
        run: npx vitest run src/lib/prisma.test.ts scripts/wp17-acceptance-preflight.test.ts src/lib/maintenance/preview-isolation.test.ts src/lib/maintenance/database-identity.test.ts src/lib/maintenance/database-identity-auth.test.ts src/app/api/maintenance/database-identity/route.test.ts src/lib/finance/financial-maintenance-auth.test.ts src/app/api/maintenance/finance/route.test.ts src/app/api/maintenance/marketplace/route.test.ts src/lib/learning/learning-runtime-gate.test.ts src/app/featuregate-isolation.test.ts --maxWorkers=2
      - name: Assignment scope decisions, revision races and dispatch
        env:
          BETTER_AUTH_URL: http://127.0.0.1:3197
        run: |
          npx vitest run src/lib/marketplace/assignment-scope.test.ts --maxWorkers=1
          dbname="workmatchr_scope_$(openssl rand -hex 6)"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $dbname"
          export DATABASE_URL="${DATABASE_URL%/*}/$dbname"
          npx --no-install prisma db push
          npx --no-install tsx scripts/test-assignment-scope-database.ts
      - name: Combined synthetic commercial chain and notification recovery
        run: npm run test:db:assignment-notifications
      - name: Durable contact admission, encryption and isolated outbox recovery
        run: |
          npm run test:db:contact
          npm run test:db:contact -- --baseline-85
      - name: Contact and payment HTTP, UI and scheduler regressions
        run: npx vitest run src/lib/contact src/app/api/contact src/app/api/payments/mollie/webhook src/components/public/contact-form.test.tsx src/app/contact/page.test.tsx --maxWorkers=2
      - run: node --test ops/marketplace-notifications/*.test.mjs
      - name: Read-only contact monitoring authorization and synthetic PostgreSQL boundaries
        run: |
          npx vitest run src/app/api/maintenance/contact-health/route.test.ts src/app/api/platform-admin/contact-reconciliation/route.test.ts --maxWorkers=1
          npx tsx scripts/test-contact-health-database.ts
          npx tsx scripts/test-contact-reconciliation-database.ts
          npx tsx scripts/test-contact-audit-retention-database.ts
          npx tsx scripts/test-contact-decision-register-database.ts
      - name: Provider offering, matching and tenant isolation
        run: |
          npx vitest run provider matching aanbiedersdossier --maxWorkers=2
          dbname="workmatchr_b4_$(openssl rand -hex 6)"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $dbname"
          export DATABASE_URL="${DATABASE_URL%/*}/$dbname"
          npm run db:deploy
          npx tsx scripts/test-provider-offering-database.ts
      - name: Historical interest, offer slots and ledger preservation
        run: npm run test:db:request-interests && npm run test:db:request-offer-slots
      - name: Financial concurrency and tenant authorization
        run: npm run test:db:finance && npm run test:db:marketplace-concurrency
      - name: Versioned Compliance and personal learning history
        run: npm run test:db:compliance-runs && npm run test:db:learning
      - name: Session security and synthetic account isolation
        run: npm run test:db:auth-sessions
      - name: Account and Arbo guide UX regression tests
        run: npx vitest run src/app/account/account-view-model.test.ts src/app/mijn-arbo-wijzers/arbo-guide-history-interface.test.ts src/app/mijn-arbo-wijzers/page.test.tsx --maxWorkers=2
      - name: Marketplace quote validity and lifecycle regressions
        run: npx vitest run src/lib/marketplace/quote-validity-date.test.ts src/lib/marketplace/quote-lifecycle.test.ts src/app/offertes/nieuw/page.test.tsx src/app/offertes/quote-presentation.test.tsx --maxWorkers=2
      - name: Infrastructure and application regressions
        run: npx vitest run src/lib/compliance src/lib/learning src/lib/finance src/lib/credits src/lib/email.test.ts src/components/compliance src/components/arbo-guide --maxWorkers=2
